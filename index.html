    <script>
      // Prevent theme flashing
      (function() {
        try {
          var theme = localStorage.getItem('calit-ui-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
